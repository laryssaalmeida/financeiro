<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro | Miguel Piccin Websites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141518;--side:#111215;--panel:#1d1f23;--panel2:#24262b;--panel3:#2A2C31;--line:rgba(243,240,233,.1);--line2:rgba(243,240,233,.17);--txt:#F3F0E9;--mut:#8A857C;--bege:#d9d4c9;--marrom:#2A2C31;--ouro:#FD571F;--ouro2:#FF7A45;--verde:#141518;--ok:#7cc79a;--coral:#FD571F;--stone:#8A857C}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.5;color-scheme:dark}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(253,87,31,.16),transparent 60%),radial-gradient(700px 500px at 10% 110%,rgba(42,44,49,.35),transparent 60%);z-index:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
aside.side{width:236px;flex:none;background:linear-gradient(180deg,#17181c,#111215);border-right:1px solid var(--line);padding:24px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.brand .logo{text-transform:none;width:34px;height:34px;border-radius:4px;background:linear-gradient(135deg,var(--ouro2),var(--ouro));color:var(--verde);display:grid;place-items:center;font-size:13px;letter-spacing:0;box-shadow:0 0 22px rgba(253,87,31,.35)}
.brand small{display:block;color:var(--ouro);font-size:9.5px;letter-spacing:.14em;margin-top:3px;font-weight:600}
nav{margin-top:30px;display:flex;flex-direction:column;gap:3px}
nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:10px 12px;border-radius:4px;cursor:pointer;text-align:left;position:relative}
nav button:hover{background:rgba(243,240,233,.05);color:var(--txt)}
nav button.on{background:linear-gradient(90deg,rgba(253,87,31,.2),rgba(253,87,31,.04));color:var(--txt);font-weight:600}
nav button.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ouro)}
nav button.on svg{color:var(--ouro2)}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mut);padding:14px 10px 0;border-top:1px solid var(--line)}
.sidefoot .mt{height:6px;border-radius:4px;background:rgba(243,240,233,.1);margin:8px 0 12px;overflow:hidden}
.sidefoot .mt i{display:block;height:100%;background:linear-gradient(90deg,var(--ouro),var(--ouro2));box-shadow:0 0 10px rgba(253,87,31,.6)}
main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1320px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:0;color:var(--txt);font-weight:700}
.lead{color:var(--mut);margin:5px 0 22px;font-size:14px}
h3{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;margin:0 0 14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro2);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.grid .card{margin:0}
.stat{display:flex;gap:14px;align-items:center}
.stat .big{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;color:var(--txt);line-height:1.1}
.stat .cap{color:var(--mut);font-size:12.5px}
.kpi .lab{color:var(--mut);font-size:12.5px;margin-bottom:6px}
.kpi .big{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1.1}
.kpi .dl{font-size:12px;color:var(--ok);margin-top:4px}
.kpi .dl.neu{color:var(--mut)}
.ring{width:58px;height:58px;flex:none;filter:drop-shadow(0 0 6px rgba(253,87,31,.35))}
.ring circle{fill:none;stroke-width:6}
.hero{background:linear-gradient(120deg,rgba(253,87,31,.22),rgba(42,44,49,.35) 60%,rgba(29,31,35,.9));border:1px solid rgba(253,87,31,.28);border-radius:4px;padding:22px 24px;margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 0 40px rgba(253,87,31,.12)}
.hero .kicker{font-family:"Barlow Condensed",sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro2);font-weight:700}
.hero .ttl{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;margin:4px 0 2px}
.hero .sub{color:var(--bege);font-size:13.5px;opacity:.85}
.hero .grow{flex:1;min-width:220px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;color:var(--verde);flex:none;box-shadow:0 0 0 2px rgba(12,13,15,.9),0 0 0 3px rgba(253,87,31,.35)}
.av.lg{width:62px;height:62px;font-size:21px}
.pr{display:flex;gap:14px;align-items:center;padding:11px 10px;border-radius:4px;cursor:pointer;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr:hover{background:rgba(243,240,233,.05)}
.pr .pi{flex:1;min-width:0}
.pr .pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pr .pi span,.pr .pm{color:var(--mut);font-size:12.5px}
.pr .pm{text-align:right}
.pr .chev{color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:4px;font-size:11.5px;white-space:nowrap;font-weight:600;background:rgba(243,240,233,.1);color:var(--bege)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.s0{background:rgba(243,240,233,.07);color:#b8b2a7}
.tag.s1{background:rgba(138,133,124,.16);color:#b8b2a7}
.tag.s2{background:rgba(253,87,31,.14);color:#ff8a5c}
.tag.s3{background:rgba(224,165,111,.16);color:#f0b47e}
.tag.s4{background:rgba(111,191,142,.15);color:#8fd6aa}
.tag.s5{background:rgba(70,160,110,.2);color:#7fd0a0}
.tag.s6{background:var(--coral);color:#F3F0E9}
.tag.s7{background:rgba(201,139,126,.16);color:#e0a497}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:4px;font-size:12px;border:1px solid var(--line2);color:var(--bege);background:rgba(243,240,233,.04)}
.muted{color:var(--mut);font-size:13px}
.btn{font:inherit;background:var(--coral);color:#F3F0E9;border:1px solid transparent;border-radius:4px;padding:9px 15px;cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:8px;align-items:center;box-shadow:0 0 18px rgba(253,87,31,.25)}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:rgba(243,240,233,.06);color:var(--txt);border-color:var(--line2);box-shadow:none;font-weight:500}
.btn.sec:hover{background:rgba(243,240,233,.11)}
.btn.ouro{background:var(--coral);color:#F3F0E9}
.btn.dan{background:none;color:#e0a497;border-color:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:4px}
.btn.ghost{background:none;border-color:transparent;color:var(--bege);padding:6px 8px;box-shadow:none;font-weight:500}
.btn.ghost:hover{background:rgba(243,240,233,.07)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{background:rgba(253,87,31,.1);border:1px solid rgba(253,87,31,.3);border-radius:4px;padding:10px 16px;margin-bottom:18px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--bege)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:12px;font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;font:inherit;font-weight:400;background:rgba(12,13,15,.55);color:var(--txt)}
input::placeholder,textarea::placeholder{color:#5f5b54}
select option{background:#1d1f23;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(253,87,31,.45);border-color:var(--ouro)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:170px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 14px}
.seg button{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:4px;border:1px solid var(--line2);background:rgba(243,240,233,.04);color:var(--bege);cursor:pointer}
.seg button.on{background:rgba(253,87,31,.22);border-color:var(--ouro);color:var(--txt);font-weight:600}
.tog{display:inline-flex;background:rgba(12,13,15,.6);border:1px solid var(--line);border-radius:4px;padding:4px;gap:2px;margin-bottom:18px}
.tog button{font:inherit;font-size:13.5px;padding:7px 14px;border:0;border-radius:4px;background:none;color:var(--mut);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tog button.on{background:var(--panel3);color:var(--txt);font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input,.toolbar select{margin:0;width:auto;flex:1;min-width:150px;max-width:260px}
.toolbar .tog{margin:0}
.kan{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{width:244px;flex:none;background:rgba(29,31,35,.75);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:140px;position:relative;overflow:hidden}
.col:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cc,var(--ouro));box-shadow:0 0 14px var(--cc,var(--ouro))}
.col.over{outline:2px dashed var(--ouro)}
.col h4{margin:4px 0 12px;font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.06em;color:var(--txt);display:flex;justify-content:space-between;font-weight:700}
.col h4 span{background:rgba(243,240,233,.1);border-radius:4px;padding:0 8px;font-family:"Manrope",sans-serif;color:var(--bege)}
.kc{background:linear-gradient(180deg,var(--panel3),var(--panel2));border-radius:4px;padding:12px;margin-bottom:9px;cursor:pointer;border:1px solid var(--line)}
.kc:hover{border-color:rgba(253,87,31,.45);box-shadow:0 0 16px rgba(253,87,31,.15)}
.kc .top{display:flex;gap:10px;align-items:center}
.kc .av{width:32px;height:32px;font-size:12px}
.kc b{display:block;font-size:13.5px;font-weight:600}
.kc .muted{font-size:12px}
.kc .ft{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--mut);align-items:center;gap:6px}
.kc .ft svg{width:13px;height:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;color:var(--mut);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
tr.lnk{cursor:pointer}
tr.lnk:hover{background:rgba(243,240,233,.04)}
.tblwrap{overflow-x:auto}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.phead .grow{flex:1;min-width:200px}
.phead h2{font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nextbar{background:linear-gradient(90deg,rgba(253,87,31,.18),rgba(253,87,31,.04));border:1px solid rgba(253,87,31,.22);border-radius:4px;padding:10px 16px;margin:14px 0 20px;font-size:13.5px;display:flex;gap:10px;align-items:center;color:var(--bege)}
.nextbar b{color:var(--txt)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.sh .n{width:30px;height:30px;border-radius:4px;background:rgba(253,87,31,.18);color:var(--ouro2);display:grid;place-items:center;flex:none}
.sh .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--txt);flex:1}
.sh .t small{display:block;font-family:"Manrope",sans-serif;font-weight:400;font-size:12.5px;color:var(--mut)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fact{background:rgba(12,13,15,.45);border:1px solid var(--line);border-radius:4px;padding:11px 14px}
.fact small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600;margin-bottom:3px}
.fact.vazio{background:none;border-style:dashed;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{font:inherit;font-size:13px;display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:4px;border:1px solid var(--line2);background:rgba(12,13,15,.45);cursor:pointer;color:var(--txt);text-align:left}
.tile:hover{border-color:rgba(253,87,31,.5)}
.tile.on{border-color:var(--ouro);background:rgba(253,87,31,.16);box-shadow:0 0 14px rgba(253,87,31,.18)}
.tile .d{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.mini{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--ouro),rgba(253,87,31,.1))}
.tl .it{position:relative;margin-bottom:16px;font-size:13.5px}
.tl .it:last-child{margin-bottom:0}
.tl .it:before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ouro);border:3px solid var(--panel);box-shadow:0 0 8px rgba(253,87,31,.6)}
.tl .when{font-size:11.5px;color:var(--mut)}
.fun{display:grid;gap:9px}
.fr{display:grid;grid-template-columns:150px 1fr 34px;gap:12px;align-items:center;font-size:13.5px}
.fr .tr{background:rgba(243,240,233,.07);border-radius:4px;height:22px;overflow:hidden}
.fr .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--marrom),var(--ouro),var(--ouro2));border-radius:4px;min-width:3px;box-shadow:0 0 12px rgba(253,87,31,.4)}
.empty{text-align:center;padding:34px 20px;color:var(--mut)}
.empty .ttl{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;color:var(--txt);margin-bottom:6px}
.empty .acts{justify-content:center;margin-top:16px}
.pts{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:4px;border:1.5px solid;font-size:11.5px;font-weight:700;background:rgba(12,13,15,.5);flex:none}
.sh .n svg{width:15px;height:15px}
.chk{font-size:12px;color:#e0a497}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.wd{border-right:1px solid var(--line);min-height:150px;padding:8px 6px;background:rgba(12,13,15,.3)}
.wd:last-child{border-right:0}
.wd.hj{background:rgba(253,87,31,.08)}
.wd .dh{text-align:center;font-size:11px;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.wd .dh b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:17px;color:var(--txt);letter-spacing:0}
.wd.hj .dh b{color:var(--ouro2)}
.ev{font-size:11px;line-height:1.3;border-radius:4px;padding:5px 7px;margin-bottom:5px;cursor:pointer;border-left:3px solid;background:rgba(243,240,233,.07);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.reu{border-color:var(--ok);background:rgba(111,191,142,.13)}
.ev.ret{border-color:var(--ouro);background:rgba(253,87,31,.14)}
.ev small{display:block;color:var(--mut);font-size:10.5px}
.um{display:flex;gap:12px;align-items:center;padding:10px 6px;border-radius:4px;cursor:pointer;border-bottom:1px solid var(--line)}.um:last-child{border-bottom:0}.um:hover{background:rgba(243,240,233,.05)}.um .ui{flex:1;min-width:0}.um .ui b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.um .ui span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.um .ud{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:4px;background:rgba(253,87,31,.16);color:#e6c477}.um .ud.r{background:rgba(111,191,142,.15);color:#8fd6aa}
.chart svg{width:100%;height:170px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:34px;border-radius:4px 7px 3px 3px;background:linear-gradient(180deg,var(--ouro2),var(--marrom));box-shadow:0 0 14px rgba(253,87,31,.35);min-height:3px}
.bars .b span{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bars .b em{font-style:normal;font-size:12px;font-weight:700}
@media(max-width:1100px){.dash{grid-template-columns:1fr}}
@media(max-width:900px){.cols{grid-template-columns:1fr}.week{grid-template-columns:repeat(7,minmax(92px,1fr));overflow-x:auto}}
@media(max-width:720px){
 .shell{display:block}
 aside.side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;padding:6px 8px;flex-direction:row;z-index:9;border-top:1px solid rgba(253,87,31,.35);border-right:0}
 .brand,.sidefoot{display:none}
 nav{margin:0;flex-direction:row;flex:1;justify-content:space-around}
 nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 8px}
 nav button.on:before{display:none}
 main{padding:20px 14px 96px}
 h2{font-size:22px}
 .pr .pm{display:none}
 .fr{grid-template-columns:110px 1fr 28px}
 .weekwrap{overflow-x:auto}
 .week{min-width:640px}
}

body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
h2,.hero .ttl,.stat .big,.kpi .big,.sh .t,.empty .ttl,.wd .dh b,.av,.col h4{font-family:"Barlow Condensed","Barlow","Arial Narrow",sans-serif}
h2{text-transform:uppercase;font-size:34px;letter-spacing:.005em;line-height:1.02}
h2 .dim{color:var(--stone)}
.phead h2{font-size:30px}
h3{font-family:"Manrope",sans-serif;color:var(--stone);letter-spacing:.16em;font-size:11px}
.sh .t{font-size:19px;text-transform:uppercase;letter-spacing:.01em}
.sh .t small{text-transform:none;font-family:"Manrope",sans-serif}
.hero .ttl{font-size:24px;text-transform:uppercase}
.kpi .big,.stat .big{font-size:34px}
.col h4{text-transform:uppercase;font-size:14px;letter-spacing:.04em}
.col h4 span{font-family:"Manrope",sans-serif}
.brand{gap:10px;padding:0 6px;letter-spacing:0;text-transform:none}
.brand .logo{width:38px;height:38px;border-radius:3px;background:var(--coral);color:#141518;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;box-shadow:0 0 24px rgba(253,87,31,.45)}
.brand .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.brand .nm small{font-family:"Manrope",sans-serif;color:var(--txt);font-size:8.5px;letter-spacing:.42em;margin-top:4px;font-weight:600}
.brand .sec{display:block;margin-top:22px;font-family:"Manrope",sans-serif;font-size:10.5px;letter-spacing:.18em;color:var(--stone);text-transform:uppercase;font-weight:600}
nav button.on{background:rgba(253,87,31,.1)}

<body>
<div class="shell">
<aside class="side">
  <div class="brand" style="flex-wrap:wrap"><span class="logo">mp/</span><div class="nm">Miguel Piccin<small>WEBSITES</small></div><span class="sec" style="width:100%">Área financeira</span></div>
  <nav id="nav"></nav>
  <div class="sidefoot" id="foot"></div>
</aside>
<main id="app"></main>
</div>
<script>
/* ===== Financeiro Miguel Piccin | Websites ===== */
var CATS_DEF=['Alimentação','Ferramentas e assinaturas','Hospedagem e domínio','Equipamentos','Transporte','Marketing e anúncios','Impostos e taxas','Outros'];
var SERVS=['Projeto Sob Medida','Renovação Expressa','Site Rápido','Manutenção mensal','Outro'];
var FORMAS=['Pix','Cartão (Mercado Pago)','Dinheiro','Transferência','Outro'];
var TIPOE=['Pagamento do projeto','Mensalidade','Comissão ou indicação','Outro'];
var STATUS=['Ativo','Pausado','Concluído'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var IC={
 home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 users:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 19v-1a4 4 0 0 0-3-3.8M15 3.2a3.5 3.5 0 0 1 0 6.6',
 entrada:'M12 3v12M7 10l5 5 5-5M4 21h16',
 cal:'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',
 bag:'M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0',
 gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7',
 plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',l:'M15 18l-6-6 6-6',r:'M9 6l6 6-6 6',
 chk:'M5 12l5 5 9-10',dl:'M12 4v11M7 10l5 5 5-5M4 20h16',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'
};
function ic(n){return '<svg class="i" viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>'}

/* ---------- dados ---------- */
var KEY='financeiro_mp_v1',mem=null,persist=true;
var fsOK=typeof window.showSaveFilePicker==='function',fh=null,pend=null,lastSeen=0,wt=null,fsMsg='';
function norm(){['clientes','entradas','fixas','extras','lembretes'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[]});if(!db.pag)db.pag={};if(!db.cfg)db.cfg={};if(!Array.isArray(db.cfg.cats))db.cfg.cats=CATS_DEF.slice();var c=db.cfg;if(c.metaFat==null)c.metaFat=3000;if(c.metaCli==null)c.metaCli=5;if(c.minimo==null)c.minimo=597}
var PAGOU=['Conta da empresa','Larissa','Miguel'];
function load(){try{var v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){persist=false}return mem}
function saveLocal(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){persist=false}}
function save(){saveLocal();if(fh){clearTimeout(wt);wt=setTimeout(gravar,400)}}
var db=load()||{};norm();
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('financeiro_mp',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbSet(v){try{var d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'fh')}catch(e){}}
async function idbGet(){try{var d=await idb();return await new Promise(function(res){var q=d.transaction('k').objectStore('k').get('fh');q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}catch(e){return null}}
async function gravar(){if(!fh)return;try{var w=await fh.createWritable();await w.write(JSON.stringify(db,null,2));await w.close();var f=await fh.getFile();lastSeen=f.lastModified;fsMsg='';db.cfg.backup=hoje();saveLocal()}catch(e){fsMsg='Não consegui gravar no arquivo. Reconecte nos Ajustes.'}foot()}
async function lerArq(force){if(!fh)return;try{var f=await fh.getFile();if(!force&&f.lastModified<=lastSeen)return;var t=await f.text();lastSeen=f.lastModified;if(!t.trim())return;var d=JSON.parse(t);if(d&&Array.isArray(d.clientes)){db=d;norm();saveLocal();render()}}catch(e){fsMsg='Não consegui ler o arquivo de dados.';foot()}}
function erroFs(e){if(e&&e.name==='AbortError')return;fsMsg='Não foi possível usar o arquivo neste navegador. Abra no Chrome ou no Edge do computador.';render()}
var TIPOARQ=[{description:'Dados do financeiro',accept:{'application/json':['.json']}}];
async function criarArq(){try{fh=await window.showSaveFilePicker({suggestedName:'financeiro-dados.json',types:TIPOARQ});pend=null;await idbSet(fh);await gravar();render()}catch(e){erroFs(e)}}
async function abrirArq(){try{var r=await window.showOpenFilePicker({types:TIPOARQ});fh=r[0];pend=null;await idbSet(fh);await lerArq(true);render()}catch(e){erroFs(e)}}
async function reconectar(){try{var p=await pend.requestPermission({mode:'readwrite'});if(p==='granted'){fh=pend;pend=null;await lerArq(true);render()}}catch(e){erroFs(e)}}
function desconectar(){fh=null;pend=null;idbSet(null);render()}
if(fsOK&&typeof indexedDB!=='undefined'){idbGet().then(function(h){if(h&&!fh){pend=h;render()}})}
window.addEventListener('focus',function(){lerArq(false)});

/* ---------- utilidades ---------- */
var st={view:'painel',mes:null,modal:null,cli:null,del:null,msg:'',q:'',fs:'Ativo'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return iso(new Date())}
function mesAtual(){return hoje().slice(0,7)}
st.mes=mesAtual();
function addMes(m,n){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)}
function nomeMes(m){return MESES[+m.slice(5,7)-1]+' de '+m.slice(0,4)}
function curto(m){return MES3[+m.slice(5,7)-1]+'/'+m.slice(2,4)}
function br(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(s){s=String(s==null?'':s).replace(/[R$\s]/g,'');if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)/100}
function brl(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function vIn(v){return v?String(v).replace('.',','):''}
function opts(arr,sel,vazio){return (vazio!=null?'<option value="">'+esc(vazio)+'</option>':'')+arr.map(function(o){return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function cliNome(id){var c=db.clientes.find(function(c){return c.id===id});return c?c.nome:''}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}

/* ---------- cálculos ---------- */
function fixasDoMes(m){return db.fixas.filter(function(f){return f.inicio<=m&&(!f.fim||f.fim>=m)}).sort(function(a,b){return (a.dia||0)-(b.dia||0)})}
function pagFixa(m,id){return (db.pag[m]||{})[id]}
function valorFixa(m,f){var p=pagFixa(m,f.id);return p&&p.valor!=null?p.valor:f.valor}
function entMes(m){return db.entradas.filter(function(e){return (e.data||'').slice(0,7)===m}).sort(function(a,b){return a.data<b.data?1:-1})}
function extMes(m){return db.extras.filter(function(e){return (e.data||'').slice(0,7)===m}).sort(function(a,b){return a.data<b.data?1:-1})}
function resumo(m){var es=entMes(m),ent=sum(es,function(e){return e.valor}),tax=sum(es,function(e){return e.taxa||0}),fix=sum(fixasDoMes(m),function(f){return valorFixa(m,f)}),ext=sum(extMes(m),function(e){return e.valor});return {ent:ent,tax:tax,fix:fix,ext:ext,sai:fix+ext+tax,lucro:ent-fix-ext-tax}}
function fechadosMes(m){return db.clientes.filter(function(c){return (c.inicio||'').slice(0,7)===m&&c.servico!=='Manutenção mensal'})}
function recebido(c){return sum(db.entradas.filter(function(e){return e.clienteId===c.id&&e.tipo==='Pagamento do projeto'}),function(e){return e.valor})}
function aReceber(c){return Math.max(0,(c.valor||0)-recebido(c))}
function mensalPaga(c,m){return entMes(m).some(function(e){return e.clienteId===c.id&&e.tipo==='Mensalidade'})}

/* ---------- navegação ---------- */
var NAV=[['painel','Painel','home'],['clientes','Clientes','users'],['entradas','Entradas','entrada'],['contas','Contas do mês','cal'],['extras','Despesas extras','bag'],['ajustes','Ajustes','gear']];
function go(v){st.view=v;st.cli=null;st.del=null;st.msg='';render();window.scrollTo(0,0)}
function mudaMes(n){st.mes=addMes(st.mes,n);render()}
function mnav(){return '<div class="mnav"><button onclick="mudaMes(-1)" title="Mês anterior">'+ic('l')+'</button><b>'+nomeMes(st.mes)+'</b><button onclick="mudaMes(1)" title="Próximo mês">'+ic('r')+'</button></div>'}
function head(t,sub,dir){return '<div class="phead"><div class="grow"><h2>'+t+'</h2>'+(sub?'<p class="lead" style="margin-bottom:0">'+sub+'</p>':'')+'</div>'+(dir||'')+'</div><div style="height:16px"></div>'}

function render(){
 document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button class="'+(st.view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+ic(n[2])+'<span>'+n[1]+'</span></button>'}).join('');
 var v={painel:vPainel,clientes:vClientes,entradas:vEntradas,contas:vContas,extras:vExtras,ajustes:vAjustes}[st.view]();
 var demo=db.cfg.demo?'<div class="warn">Você está vendo dados de exemplo. <button class="btn sm sec" onclick="limparDemo()">Apagar exemplo e começar</button></div>':'';
 var aviso=!persist?'<div class="warn">Este navegador não está guardando os dados. Abra o app no Chrome do computador para não perder nada.</div>':'';
 document.getElementById('app').innerHTML=aviso+demo+v+modal();
 foot();
}
function foot(){var r=resumo(mesAtual());var b=fh?'Backup em arquivo ligado'+(db.cfg.backup?' ('+br(db.cfg.backup)+')':''):(pend?'Backup desconectado':'Backup em arquivo desligado');
 document.getElementById('foot').innerHTML='<div>Lucro de '+MESES[+mesAtual().slice(5,7)-1].toLowerCase()+'</div><div style="font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:700;color:'+(r.lucro<0?'#e0a497':'var(--txt)')+'">'+brl(r.lucro)+'</div><div style="margin-top:8px">'+b+'</div>'+(fsMsg?'<div class="chk">'+esc(fsMsg)+'</div>':'')}

/* ---------- painel ---------- */
function vPainel(){
 var m=st.mes,r=resumo(m),vazio=!db.clientes.length&&!db.entradas.length&&!db.fixas.length&&!db.extras.length;
 var h=head('Painel <span class="dim">financeiro</span>','Entradas, saídas e lucro da Miguel Piccin Websites.',mnav());
 if(vazio)return h+'<div class="card empty"><div class="ttl">Ainda não tem nada registrado</div><div>Comece cadastrando um cliente, uma entrada ou as contas fixas do mês.</div><div class="acts"><button class="btn" onclick="abrir(\'cliente\')">'+ic('plus')+'Novo cliente</button><button class="btn sec" onclick="abrir(\'fixa\')">Nova conta fixa</button><button class="btn sec" onclick="carregarDemo()">Ver com dados de exemplo</button></div></div>';
 h+='<div class="grid">'+kpi('Entradas',r.ent,entMes(m).length+' recebimento(s)')+kpi('Contas do mês',r.fix,fixasDoMes(m).length+' conta(s) fixa(s)')+kpi('Despesas extras',r.ext,extMes(m).length+' registro(s)'+(r.tax?' + '+brl(r.tax)+' em taxas':''))+kpi('Lucro do mês',r.lucro,r.ent?'Margem de '+Math.round(r.lucro/r.ent*100)+'%':'Entradas menos saídas',true)+'</div>'+cardMetas(m);
 h+='<div class="dash"><div><div class="card"><h3>Entradas x saídas nos últimos 6 meses</h3>'+grafico(m)+'</div>'+cardCats(m)+'</div><div>'+cardLembretes()+cardAlertas(m)+cardReceber()+'</div></div>';
 return h;
}
function barra(p){return '<div class="mt" style="height:8px;border-radius:4px;background:rgba(243,240,233,.1);overflow:hidden;margin:10px 0 8px"><i style="display:block;height:100%;width:'+Math.min(100,p)+'%;background:'+(p>=100?'var(--ok)':'linear-gradient(90deg,var(--ouro),var(--ouro2))')+'"></i></div>'}
function cardMetas(m){var c=db.cfg,fs=fechadosMes(m),vend=sum(fs,function(x){return x.valor||0}),rec=resumo(m).ent,pf=c.metaFat?vend/c.metaFat*100:0,pc=c.metaCli?fs.length/c.metaCli*100:0,abaixo=fs.filter(function(x){return (x.valor||0)<c.minimo});
 return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card kpi"><div class="lab">Meta de faturamento do mês</div><div class="big">'+brl(vend)+' <span class="muted" style="font-family:Manrope,sans-serif;font-size:14px;font-weight:500">de '+brl(c.metaFat)+'</span></div>'+barra(pf)+'<div class="dl neu">'+(vend>=c.metaFat?'<span class="pos">Meta batida! '+brl(vend-c.metaFat)+' acima da meta.</span>':'Faltam '+brl(c.metaFat-vend)+' em contratos fechados.')+' Recebido no mês: '+brl(rec)+'.</div></div>'+
 '<div class="card kpi"><div class="lab">Meta de clientes do mês</div><div class="big">'+fs.length+' <span class="muted" style="font-family:Manrope,sans-serif;font-size:14px;font-weight:500">de '+c.metaCli+' contratos</span></div>'+barra(pc)+'<div class="dl neu">'+(fs.length>=c.metaCli?'<span class="pos">Meta de clientes batida!</span>':'Faltam '+(c.metaCli-fs.length)+' contrato(s).')+' Valor mínimo por contrato: '+brl(c.minimo)+'.'+(abaixo.length?' <span class="neg">'+abaixo.length+' contrato(s) abaixo do mínimo.</span>':'')+'</div></div></div>'}
function kpi(l,v,s,luc){return '<div class="card kpi"><div class="lab">'+l+'</div><div class="big'+(luc?(v<0?' neg':''):'')+'">'+brl(v)+'</div><div class="dl neu">'+s+'</div></div>'}
function grafico(m){
 var ms=[];for(var i=5;i>=0;i--)ms.push(addMes(m,-i));
 var rs=ms.map(resumo),mx=Math.max.apply(null,rs.map(function(r){return Math.max(r.ent,r.sai)}).concat([1]));
 var W=620,H=230,top=24,base=180,gw=W/6,bw=Math.min(30,gw/3.2),s='';
 for(var g=0;g<=4;g++){var y=base-(base-top)*g/4;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(243,240,233,.08)"/>'}
 rs.forEach(function(r,i){var cx=gw*i+gw/2,he=(base-top)*r.ent/mx,hs=(base-top)*r.sai/mx;
  s+='<rect x="'+(cx-bw-2)+'" y="'+(base-he)+'" width="'+bw+'" height="'+Math.max(he,1)+'" rx="3" fill="#FD571F"><title>Entradas: '+brl(r.ent)+'</title></rect>';
  s+='<rect x="'+(cx+2)+'" y="'+(base-hs)+'" width="'+bw+'" height="'+Math.max(hs,1)+'" rx="3" fill="#8A857C"><title>Saídas: '+brl(r.sai)+'</title></rect>';
  s+='<text x="'+cx+'" y="'+(base+18)+'" text-anchor="middle" fill="'+(ms[i]===m?'#F3F0E9':'#8A857C')+'" font-size="12" font-weight="'+(ms[i]===m?700:400)+'">'+curto(ms[i])+'</text>';
  s+='<text x="'+cx+'" y="'+(base+36)+'" text-anchor="middle" fill="'+(r.lucro<0?'#e0a497':'#7cc79a')+'" font-size="11.5">'+brl(r.lucro).replace(',00','')+'</text>'});
 return '<div class="gchart"><svg viewBox="0 0 '+W+' '+H+'" font-family="Manrope,sans-serif">'+s+'</svg></div><div class="legend"><span><i style="background:#FD571F"></i>Entradas</span><span><i style="background:#8A857C"></i>Saídas</span><span><i style="background:#7cc79a"></i>Lucro (embaixo de cada mês)</span></div>';
}
function cardCats(m){
